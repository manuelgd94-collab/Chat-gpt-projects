name: Build dashboard

on:
  push:
    branches: [main]
    paths:
      - 'maximo-dashboard/src/**'
      - 'maximo-dashboard/package*.json'
      - 'maximo-dashboard/vite.config.*'
      - 'maximo-dashboard/tsconfig*'
      - 'maximo-dashboard/tailwind.config.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: maximo-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: maximo-dashboard
        run: npm ci

      - name: Build
        working-directory: maximo-dashboard
        run: npm run build

      - name: Copy to repo root
        working-directory: maximo-dashboard
        run: node scripts/copy-to-root.mjs

      - name: Commit updated dashboard.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard.html
          if git diff --staged --quiet; then
            echo "No changes to dashboard.html"
          else
            git commit -m "chore: rebuild dashboard.html [skip ci]"
            git push
          fi
